function clearRace(){gm.forEach(m=>S.remove(m));ai.forEach(a=>S.remove(a.m));gm=[];ai=[];gates=[]}
function toBuild(){mode='build';sl.visible=false;gl.visible=false;$('vg').style.opacity=0;clearRace();$('ui').style.display='';$('hud').style.display='none';clouds.visible=false;build()}
function respawn(pen){if(mode==='build')return;const prev=mode==='race'?GP((gi+N-1)%N):new V3(0,120,0),nx=mode==='race'?gates[gi]:new V3(0,120,-100),d=nx.clone().sub(prev);d.y=0;d.normalize();
P.copy(prev);P.y+=6;q.setFromUnitVectors(new V3(0,0,-1),d);V.copy(d).multiplyScalar(stat.vr>75?stat.vr:65);rt+=pen;thr=.65}
function begin(m){try{if(!build())return;mode=m;clearRace();$('ui').style.display='none';$('hud').style.display='block';clouds.visible=true;sl.visible=true;gl.visible=true;$('big').textContent='';
P.set(0,150,0);q.identity();V.set(0,0,-65);thr=.6;time=0;cdn=0;rt=0;lap=0;gi=0;done=false;lastLap=0;
if(m==='race'){for(let i=0;i<N;i++){gates.push(GP(i));const g=new T.Group(),r=new T.Mesh(new T.TorusGeometry(32,2.6,10,32),new T.MeshBasicMaterial({color:0x35e0ff})),d=new T.Mesh(new T.CircleGeometry(32,32),new T.MeshBasicMaterial({color:0x35e0ff,transparent:true,opacity:.1,side:T.DoubleSide,depthWrite:false}));g.add(r,d);g.position.copy(gates[i]);g.lookAt(GP(i+1));S.add(g);gm.push(g)}
const st=GP(N-1).clone().lerp(gates[0],.5),d=gates[0].clone().sub(st);d.y=0;d.normalize();P.copy(st);P.y=100;q.setFromUnitVectors(new V3(0,0,-1),d);V.copy(d).multiplyScalar(65);const sd=new V3(-d.z,0,d.x);
for(let i=0;i<5;i++){const g=new T.Group(),mt=new T.MeshStandardMaterial({color:new T.Color().setHSL(i/5,.8,.5),metalness:.4,roughness:.3}),c=new T.Mesh(new T.ConeGeometry(.5,5,8),mt);c.rotation.x=-Math.PI/2;g.add(c,new T.Mesh(new T.BoxGeometry(6,.08,1.4),mt));S.add(g);
ai.push({m:g,p:st.clone().addScaledVector(sd,(i-2)*26+(i>1?26:0)).setY(100+i*4),gi:0,lap:0,sp:57+Math.random()*10})}cdn=3.99}}catch(e){mode='build';$('msg').textContent='Error: '+e.message}}
$('tf').onclick=()=>begin('fly');$('rc').onclick=()=>begin('race');
const tmp=new V3();
function phys(dt){const st=stat,f=new V3(0,0,-1).applyQuaternion(q),u=new V3(0,1,0).applyQuaternion(q);
if(k.arrowup)thr=Math.min(1,thr+dt*.6);if(k.arrowdown)thr=Math.max(0,thr-dt*.6);
const v=V.length(),sc=Math.min(1,v/25),bo=k[' ']?1.6:1,br=k.shift?1:0;
const pi=((k.s?1:0)-(k.w?1:0))*1.2*st.pa*Math.min(1.3,.6+.4*st.stab)*sc,ro=((k.q?1:0)-(k.e?1:0))*2.2*st.ra*sc,ya=((k.a?1:0)-(k.d?1:0))*.9*sc;
let wob=st.stab<.25?Math.sin(time*3)*(.25-st.stab)*.9:0;if(v<.5*st.vr)wob-=(1-v/(.5*st.vr))*1.0;
q.multiply(new T.Quaternion().setFromEuler(new T.Euler((pi+wob)*dt,ya*dt,ro*dt))).normalize();
const aoa=Math.atan2(-V.dot(u),Math.max(V.dot(f),1));let cl=(aoa+.09)/.09*st.CLa;if(aoa>st.aSt)cl*=.35;cl=Math.max(-1.2,Math.min(2.4,cl));
const lift=9.8*(v/st.vr)**2*cl,drag=st.cdp*v*v*(1+br*3)*(1+Math.abs(aoa)*3)+st.ki*lift*lift/(v*v+100);
const a=new V3(Math.sin(time*.7+P.z*.01)*.8,-9.8,Math.cos(time*.5)*.5).addScaledVector(u,lift).addScaledVector(f,st.thrust*thr*bo);
const vd=V.clone().normalize();a.addScaledVector(vd,-drag);V.addScaledVector(a,dt);
const sp=V.length();if(sp>1)V.normalize().lerp(f,Math.min(1,dt*(1.2*Math.max(st.stab,.05)+.3))).normalize().multiplyScalar(sp);P.addScaledVector(V,dt);
if(P.y<H(P.x,P.z)+1.5||P.y<.5){respawn(3);$('big').textContent='CRASH';setTimeout(()=>{if(cdn<=0)$('big').textContent=''},900)}return{aoa}}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
dome.position.copy(cam.position);sunS.position.copy(cam.position).addScaledVector(SD,5000);
if(mode==='build'){if(pg){pg.position.set(0,300,0);pg.quaternion.setFromEuler(new T.Euler(.35,time*.6,0))}if(prop)prop.rotation.z+=dt*30;cam.fov=50;cam.updateProjectionMatrix();cam.position.set(0,302,16);cam.lookAt(-3,300,0);sun.position.set(40,340,30);sun.target.position.set(0,300,0);R.render(S,cam);return}
if(cdn>0){cdn-=dt;$('big').textContent=cdn>.99?Math.floor(cdn):'GO!';if(cdn<=0)$('big').textContent=''}
else{fi=phys(dt);if(mode==='race'){rt+=dt;
ai.forEach(a=>{const g=gates[a.gi],d=g.clone().sub(a.p),dist=d.length();d.normalize();a.p.addScaledVector(d,a.sp*dt);a.p.y=Math.max(a.p.y,H(a.p.x,a.p.z)+20);a.m.position.copy(a.p);a.m.lookAt(a.p.clone().sub(d));if(dist<45){a.gi++;if(a.gi>=N){a.gi=0;a.lap++}}});
if(!done&&P.distanceTo(gates[gi])<42){gi++;if(gi>=N){gi=0;lap++;lastLap=rt}}
if(lap>=LAPS&&!done){done=true;$('big').textContent='FINISH P'+(1+ai.filter(a=>a.lap>=LAPS).length)+'  '+rt.toFixed(1)+'s';setTimeout(toBuild,5000)}
gm.forEach((m,i)=>m.children.forEach(c=>c.material.color.set(i===gi?0xffb020:0x35e0ff)))}}
pg.position.copy(P);pg.quaternion.copy(q);prop.rotation.z+=dt*(10+thr*60);
const f=new V3(0,0,-1).applyQuaternion(q),u=new V3(0,1,0).applyQuaternion(q);
if(cm===0)tmp.copy(P).addScaledVector(f,-(11+V.length()*.06)).addScaledVector(u,4.5);else if(cm===1)tmp.copy(P).addScaledVector(f,-.3).addScaledVector(u,.9);else tmp.set(P.x+Math.cos(time*.5)*30,P.y+8,P.z+Math.sin(time*.5)*30);
cam.position.lerp(tmp,cm===1?1:Math.min(1,dt*6));if(cm===1)cam.quaternion.copy(q);else cam.lookAt(P.clone().addScaledVector(f,cm===0?20:0));
cam.fov=60+Math.min(30,V.length()*.28)+(k[' ']?8:0);cam.updateProjectionMatrix();
sun.position.copy(P).addScaledVector(SD,300);sun.target.position.copy(P);streaks();groundRush();const alt0=P.y-H(P.x,P.z),low=Math.max(0,1-alt0/50),shk=Math.max(0,V.length()-70)*.0016+low*V.length()*.0006;$('vg').style.opacity=Math.min(.8,Math.max(0,(V.length()-50)/110)+low*.25);cam.position.x+=(Math.random()-.5)*shk;cam.position.y+=(Math.random()-.5)*shk;
R.render(S,cam);
$('h1').innerHTML=`SPD ${(V.length()*3.6).toFixed(0)} km/h<br>ALT ${(P.y-H(P.x,P.z)).toFixed(0)} m<br>PWR ${(thr*100).toFixed(0)}%${k[' ']?' +BOOST':''}<br>AOA ${(fi.aoa*57.3).toFixed(0)}&deg; ${fi.aoa>stat.aSt?'<b style=color:#f66>STALL</b>':''}<br>STALL SPD ~${(stat.vr*3.6*.8).toFixed(0)}`;
if(mode==='race'){const sco=(l,g,p)=>(l*N+g)*1e4-p.distanceTo(gates[g]),me=sco(lap,gi,P);
$('h2').innerHTML=`POS ${1+ai.filter(a=>sco(a.lap,a.gi,a.p)>me).length}/6<br>LAP ${Math.min(lap+1,LAPS)}/${LAPS}<br>GATE ${gi+1}/${N}<br>TIME ${rt.toFixed(1)}s<br>LAST ${lastLap.toFixed(1)}s`}else $('h2').innerHTML=`FREE FLIGHT<br>${$('arch').textContent}`}
poly(D1);requestAnimationFrame(loop);
</script></body></html>
